[package]
name = "appletree"
version = "1.1.0"
edition = "2021"
# The SOURCE licence, unchanged: inherited BlitzTree history is MIT, everything
# on top of it is CC BY-NC-SA 4.0. Buying the app on the Mac App Store grants
# that buyer commercial use of their compiled copy — a personal grant that does
# not alter the source terms, which stay NonCommercial for everyone. See LICENSE.
license = "MIT AND CC-BY-NC-SA-4.0"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "appletree"
path = "src/bin/appletree/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:serde_json"]

[dependencies]
libc = "0.2"
rayon = "1.10"
serde_json = { version = "1.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
