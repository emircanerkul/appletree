[package]
name = "appletree"
version = "0.0.1"
edition = "2021"
license = "MIT AND CC-BY-NC-SA-4.0"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "appletree"
path = "src/bin/appletree/main.rs"
required-features = ["cli"]

# Bench-only experiment harness. Not built in the default (shipped) surface.
[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench-tools"]

[features]
cli = ["dep:serde_json"]
# Opt-in benchmark tooling (searchfs(2) catalog scan). No dependencies.
bench-tools = []

[dependencies]
libc = "0.2"
rayon = "1.10"
serde_json = { version = "1.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
