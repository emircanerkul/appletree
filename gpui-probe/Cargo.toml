[package]
name = "gpui-probe"
version = "0.0.1"
edition = "2021"
publish = false

# Throwaway measurement probe: renders the same engine tree through Ely/GPUI
# so its frame cost can be compared with the SwiftUI app's measured numbers.
# Not part of the shipped app; its Cargo.lock and target stay inside here.

[dependencies]
appletree = { path = ".." }
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["stacker"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["font-kit"] }

[profile.release]
lto = "thin"
codegen-units = 1
